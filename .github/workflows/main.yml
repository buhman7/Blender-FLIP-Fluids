name: Build FLIP Fluids Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSYS2 & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-alembic
            mingw-w64-x86_64-imath
            mingw-w64-x86_64-python

      - name: Build & Package FLIP Fluids
        run: |
          export CMAKE_PREFIX_PATH=/mingw64
          DEPS=$(ldd /mingw64/bin/libAlembic.dll /mingw64/bin/libImath-3_*.dll /mingw64/bin/libgomp-1.dll | awk '/\/mingw64\/bin\// {print $3}' | sort -u | tr '\n' ' ')
          python3 build.py -cmake-path /mingw64/bin/cmake.exe -make-path /mingw64/bin/mingw32-make.exe -package-dependencies /mingw64/bin/libAlembic.dll /mingw64/bin/libImath-3_*.dll /mingw64/bin/libgomp-1.dll $DEPS

      - name: Upload Addon ZIP
        uses: actions/upload-artifact@v7
        with:
          name: flip_fluids_addon.zip
          path: build/bl_flip_fluids/*.zip
          archive: false
