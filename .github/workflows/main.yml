name: Build FLIP Fluids Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSYS2 & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-alembic
            mingw-w64-ucrt-x86_64-imath
            mingw-w64-ucrt-x86_64-python

      - name: Build Addon
        run: |
          export CMAKE_PREFIX_PATH=/ucrt64
          python3 build.py
          find build -maxdepth 4

      - name: Package Addon if Unzipped
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path build -Recurse -Filter "*.zip"
          if ($zips.Count -eq 0) {
            $addonDir = Get-ChildItem -Path build -Recurse -Directory -Filter "flip_fluids_addon" | Select-Object -First 1
            if ($addonDir) {
              Compress-Archive -Path $addonDir.FullName -DestinationPath "build/flip_fluids_addon.zip" -Force
            } else {
              Write-Error "Build failed: flip_fluids_addon folder was not created. Check the 'Build Addon' log above."
              exit 1
            }
          }

      - name: Upload Addon ZIP
        uses: actions/upload-artifact@v7
        with:
          name: flip_fluids_addon.zip
          path: build/**/*.zip
          archive: false
