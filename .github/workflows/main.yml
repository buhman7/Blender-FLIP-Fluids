name: Build FLIP Fluids Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSYS2 & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-alembic
            mingw-w64-ucrt-x86_64-imath

      - name: Compile FLIP Fluids
        run: |
          mkdir -p build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          mingw32-make -j$(nproc)

      - name: Bundle Runtime DLLs
        run: |
          LIB_DIR="build/bl_flip_fluids/flip_fluids_addon/ffengine/lib"
          if [ ! -d "$LIB_DIR" ]; then
            echo "Build failed: $LIB_DIR does not exist."
            exit 1
          fi
          ldd "$LIB_DIR"/*.dll | awk '/\/ucrt64\/bin\// {print $3}' | sort -u | xargs -r cp -v -t "$LIB_DIR/"
          ls -la "$LIB_DIR"

      - name: Package Addon ZIP
        shell: pwsh
        run: |
          $addonPath = "build/bl_flip_fluids/flip_fluids_addon"
          if (-not (Test-Path "$addonPath/__init__.py")) {
            Write-Error "Invalid addon structure: __init__.py missing!"
            exit 1
          }
          Compress-Archive -Path $addonPath -DestinationPath "build/flip_fluids_addon.zip" -Force

      - name: Upload Addon ZIP
        uses: actions/upload-artifact@v7
        with:
          name: flip_fluids_addon.zip
          path: build/flip_fluids_addon.zip
          archive: false
